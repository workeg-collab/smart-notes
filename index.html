<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>نوتتي الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#0F1B33;--mut:#66738C;--line:#E2E7EF;--acc:#F2A33A;--accI:#fff;--pos:#1F8A64;--neg:#C2452D;--side:#0F1B33;--sideT:#C9D2E4;--shadow:0 1px 2px rgba(15,27,51,.06),0 6px 20px rgba(15,27,51,.05);--r:14px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#141D33;--ink:#E8ECF5;--mut:#93A0BC;--line:#243050;--accI:#0B1220;--pos:#4FC39B;--neg:#F0836C;--side:#0A1020;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#141D33;--ink:#E8ECF5;--mut:#93A0BC;--line:#243050;--accI:#0B1220;--pos:#4FC39B;--neg:#F0836C;--side:#0A1020;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 Cairo,"Segoe UI",Tahoma,sans-serif;padding-bottom:96px}
main{max-width:760px;margin:0 auto;padding:18px 16px}
h1{font-size:24px;font-weight:800;margin:4px 0 14px;letter-spacing:-.2px}
h2{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--mut)}
.hd{display:flex;align-items:center;gap:10px;margin-block:4px 14px}.hd h1{margin:0}.hd .meta{flex:1}.lkm svg{width:20px;height:20px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
textarea,input,select,button{font:inherit;color:inherit}
textarea,input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(242,163,58,.25)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea{min-height:96px;resize:vertical;font-size:17px}
.btn{background:var(--ink);color:var(--accI);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:#0F1B33}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 130px}.row>.btn{flex:0 0 auto}
.cap-row{margin-top:10px}.cap-row>.meta{flex:1 1 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 13px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--accI);border-color:var(--ink)}
.ex .chip{background:transparent;color:var(--mut);font-size:13px;border-style:dashed}.ex .chip:hover{color:var(--ink);border-color:var(--acc)}
.it{display:flex;gap:12px;align-items:flex-start}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--bg);flex:none}
.t-money,.t-receivable{background:rgba(31,138,100,.16)}.t-reminder,.t-normal{background:rgba(242,163,58,.2)}
.t-link,.t-bill{background:rgba(59,130,246,.16)}.t-phone,.t-installment{background:rgba(139,92,246,.16)}.t-payable{background:rgba(194,69,45,.16)}
.it .b{flex:1;min-width:0;overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:13px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:17px;border-radius:8px;padding:2px 6px}.x:hover{background:var(--bg);color:var(--ink)}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
.toast{background:rgba(242,163,58,.2);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:19px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.st span{display:block;color:var(--mut);font-size:13px}.st b{display:block;font-size:21px;font-weight:800;line-height:1.5}.st b.sm{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.st em{font-style:normal;color:var(--mut);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 0 8px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.in i{background:var(--pos)}
.lb{display:flex;justify-content:space-between;font-size:14px}
.due{background:var(--neg);color:#fff;border-radius:var(--r);padding:10px 14px;margin-bottom:10px;font-weight:700}
.pw{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:plaintext}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;max-width:140px;background:none;border:0;padding:8px 2px 6px;cursor:pointer;color:var(--mut);font-size:12px;font-weight:600}
nav em{font-style:normal;display:block}
.si{display:block;width:22px;height:22px;margin:0 auto 2px}.si svg{width:22px;height:22px;display:block}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";display:block;height:3px;width:24px;background:var(--acc);border-radius:3px;margin:3px auto 0}
nav .brand,nav .lockbtn{display:none}
.fab{position:fixed;left:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--acc);color:#0F1B33;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(242,163,58,.45);z-index:20}
.fab svg{width:28px;height:28px}
.fab.on{background:var(--neg);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,69,45,.5)}100%{box-shadow:0 0 0 22px rgba(194,69,45,0)}}
@media (prefers-reduced-motion:reduce){.fab.on{animation:none}}
.vt{position:fixed;left:18px;bottom:calc(158px + env(safe-area-inset-bottom,0px));max-width:min(340px,calc(100% - 36px));background:var(--ink);color:var(--accI);padding:10px 14px;border-radius:14px;z-index:20;font-weight:600;box-shadow:var(--shadow)}
.vt[hidden]{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#lock[hidden]{display:none}
.lbox{width:100%;max-width:320px;text-align:center}.lbox input{text-align:center;letter-spacing:4px}.lbox .btn{width:100%;margin-top:8px}
@media (min-width:900px){
 body{padding-bottom:0}
 nav{inset:0 0 0 auto;width:236px;flex-direction:column;justify-content:flex-start;background:var(--side);border:0;padding:22px 14px;gap:4px}
 nav .brand{display:flex;align-items:center;gap:12px;color:#fff;padding:2px 8px 22px}
 .brand i{font-style:normal;background:var(--acc);color:#0F1B33;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:19px}
 .brand b{display:block;line-height:1.2;font-size:17px}.brand small{color:var(--sideT);font-size:12px}
 nav button{max-width:none;flex:none;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;color:var(--sideT);text-align:start}
 nav button:hover{background:rgba(255,255,255,.06)}
 nav button.on{background:rgba(255,255,255,.1);color:#fff}nav button.on::after{display:none}
 .si{margin:0}
 nav .lockbtn{display:flex;margin-top:auto}
 main{margin-right:236px;max-width:none;padding:32px 44px}
 main>*{max-width:860px;margin-left:auto;margin-right:auto}
 main>input{display:block}
 .fab{bottom:28px;left:28px}.vt{bottom:104px;left:28px}
 .lkm{display:none}
}
</style>
</head>
<body>
<div id="lock" hidden></div>
<button id="fab" class="fab" aria-label="تسجيل صوتي" title="تسجيل صوتي (Alt+M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
<div id="vt" class="vt" hidden></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('sn1'))}catch(e){}
S=S||{items:[]};
const save=()=>{try{localStorage.setItem('sn1',JSON.stringify(S))}catch(e){}};
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,PW={},lastAct=Date.now();
async function derive(pin,salt){const m=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(txt){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,TE.encode(txt));return{iv:b64(iv),ct:b64(c)}}
async function unseal(o){return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},KEY,ub(o.ct)))}
function showLock(){KEY=null;PW={};shown={};const f=!S.lock,L=$('#lock');L.hidden=false;
 L.innerHTML=`<div class="lbox"><div style="font-size:40px">🔒</div><h1>${f?'اعمل PIN للتطبيق':'اكتب الـ PIN'}</h1><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN (٤ أرقام أو أكتر)">${f?'<input id="pin2" type="password" inputmode="numeric" placeholder="أعد كتابة الـ PIN" style="margin-top:8px">':''}<div class="neg" id="lerr" style="min-height:26px"></div><button class="btn acc" id="unl">${f?'حفظ وفتح':'فتح'}</button>${f?'<div class="meta" style="margin-top:10px">لو نسيت الـ PIN مفيش طريقة لاسترجاع الباسوردات.</div>':''}</div>`;
 setTimeout(()=>$('#pin').focus(),50)}
async function unlock(){const pin=$('#pin').value,err=m=>{$('#lerr').textContent=m};
 if(pin.length<4)return err('الـ PIN لازم يكون ٤ خانات على الأقل');
 try{
  if(!S.lock){if(pin!==$('#pin2').value)return err('الـ PIN مش متطابق');
   const salt=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pin,salt);S.lock={salt:b64(salt),chk:await seal('ok')};
   for(const i of S.items)if(i.type==='password'&&i.value!==undefined){PW[i.id]=i.value;i.enc=await seal(i.value);delete i.value;i.text=i.label}
   save();
  }else{KEY=await derive(pin,ub(S.lock.salt));if(await unseal(S.lock.chk)!=='ok')throw 0;
   for(const i of S.items)if(i.enc){try{PW[i.id]=await unseal(i.enc)}catch(e){PW[i.id]='⚠'}}}
 }catch(e){KEY=null;return err('الـ PIN غلط')}
 $('#lock').hidden=true;$('#lock').innerHTML='';lastAct=Date.now();render()}
async function sealPw(it){it.enc=await seal(it.value);PW[it.id]=it.value;delete it.value;it.text=it.label;add(it);toast='اتسجّلت كـ باسورد (مشفّر)';render()}
document.addEventListener('click',e=>{if(e.target.id==='unl')unlock();if(e.target.closest('#fab'))micToggle();if(e.target.closest('#lk'))showLock();lastAct=Date.now()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pin'||e.target.id==='pin2'))unlock();lastAct=Date.now()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)window._h=Date.now();else if(KEY&&window._h&&Date.now()-window._h>60000)showLock()});
setInterval(()=>{if(KEY&&Date.now()-lastAct>120000)showLock()},5000);
const REMK={normal:['⏰','تذكير'],installment:['💳','قسط'],bill:['🧾','فاتورة'],receivable:['📥','فلوس ليا برة'],payable:['📤','فلوس عليا']};
const REC={none:'',week:'أسبوعي',month:'شهري',year:'سنوي'};
const kk=i=>REMK[i.kind||'normal']||REMK.normal;
const remIcon=i=>kk(i)[0],remTitle=i=>kk(i)[1];
const remLine=i=>((i.kind&&i.kind!=='normal')?kk(i)[1]+': ':'')+i.text+(i.amount?' — '+egp(i.amount):'')+(i.who?' ('+i.who+')':'');
const daysLeft=i=>{const d=Math.ceil((i.at-Date.now())/864e5);return d<=1?'أقل من يوم':d+' أيام'};
function preCheck(i,n){if(i.type!=='reminder'||i.done||i.pfired||!i.lead||i.at<=n||i.at-i.lead*864e5>n)return false;i.pfired=true;
 try{if(Notification.permission==='granted')new Notification(remTitle(i)+' قريب',{body:remLine(i)+' — باقي '+daysLeft(i)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}return true}
function nextAt(i){const d=new Date(i.at),n=Date.now();let g=0;
 do{if(i.rec==='week')d.setDate(d.getDate()+7);
  else if(i.rec==='month'){const day=i.day||d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  else d.setFullYear(d.getFullYear()+1)}while(d.getTime()<=n&&++g<500);return d.getTime()}
function completeRem(id,rec){const i=S.items.find(x=>x.id===id);if(!i)return;
 if(rec&&i.amount){const inc=i.kind==='receivable';add({id:uid(),ts:Date.now(),type:'money',kind:inc?'in':'out',amount:i.amount,cat:inc?'دخل':i.kind==='installment'?'أقساط':i.kind==='bill'?'فواتير':'عام',who:i.who||'',text:remLine(i)});toast='اتسجّلت في المصروفات والدخل'}
 if(i.rec&&i.rec!=='none'){if(!i.day)i.day=new Date(i.at).getDate();i.at=nextAt(i);i.fired=false;i.pfired=false}else i.done=true;
 save();render()}
function snooze(id){const i=S.items.find(x=>x.id===id);if(i){i.at+=864e5;i.fired=false;i.pfired=false;save();render()}}
function remCard(i){const k=kk(i),late=!i.done&&i.at<Date.now();
 const meta=[k[1],fmt(i.at)];if(i.rec&&i.rec!=='none')meta.push(REC[i.rec]);if(i.lead&&!i.done)meta.push('تنبيه قبلها بـ '+i.lead+' يوم');
 const st=i.done?' ✔':late?' · <span class="neg">متأخر</span>':' · باقي '+daysLeft(i);
 const btns=i.done?'':`<div class="row" style="margin-top:6px"><button class="btn" data-done="${i.id}">تم</button>${i.amount?`<button class="btn ghost" data-donem="${i.id}">تم + سجّل في المصروفات</button>`:''}<button class="btn ghost" data-snz="${i.id}">بكرة</button></div>`;
 return `<div class="card it"><div class="ic t-${i.kind||'normal'}">${k[0]}</div><div class="b"><b>${esc(remLine(i))}</b><div class="meta">${meta.join(' · ')}${st}</div>${btns}</div><button class="x" data-del="${i.id}" aria-label="حذف">✕</button></div>`}
function rem(){
 const n=Date.now(),all=S.items.filter(i=>i.type==='reminder'),r=all.filter(i=>!i.done).sort((a,b)=>a.at-b.at),dn=all.filter(i=>i.done).sort((a,b)=>b.at-a.at).slice(0,10);
 const sum=ks=>r.filter(i=>ks.includes(i.kind)).reduce((a,i)=>a+(i.amount||0),0);
 const perm='Notification' in window?Notification.permission:'denied';
 const opt=o=>Object.entries(o).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 const sec=(t,a)=>a.length?`<h2>${t}</h2>`+a.map(remCard).join(''):'';
 return `<h1>التذكيرات والمستحقات</h1>${toast?`<div class="toast">${toast}</div>`:''}
 <div class="card sum"><div>أقساط وفواتير<b class="neg">${egp(sum(['installment','bill']))}</b></div><div>فلوس ليا برة<b class="pos">${egp(sum(['receivable']))}</b></div><div>فلوس عليا<b class="neg">${egp(sum(['payable']))}</b></div></div>
 <div class="card"><div class="row"><select id="rk">${opt({normal:'تذكير عادي',installment:'قسط',bill:'فاتورة',receivable:'فلوس ليا عند حد',payable:'فلوس عليا لحد'})}</select><input id="rt" placeholder="العنوان (مثال: قسط العربية)"></div>
 <div class="row" style="margin-top:8px"><input id="ra" type="number" inputmode="decimal" placeholder="المبلغ (اختياري)"><input id="rw" placeholder="مين؟ (اختياري)"></div>
 <div class="row" style="margin-top:8px"><input id="rd" type="datetime-local"><select id="rr">${opt({none:'مرة واحدة',week:'كل أسبوع',month:'كل شهر',year:'كل سنة'})}</select></div>
 <div class="row" style="margin-top:8px"><select id="rl">${opt({0:'نبّهني وقت الميعاد بس',1:'وقبلها بيوم',3:'وقبلها بـ 3 أيام',7:'وقبلها بأسبوع'})}</select><button class="btn acc" id="radd">إضافة</button></div>
 ${perm!=='granted'?'<div class="row" style="margin-top:8px"><button class="btn ghost" id="perm">فعّل الإشعارات</button></div>':'<div class="meta" style="margin-top:6px">الإشعارات شغّالة. التنبيه بيوصل لما التطبيق يكون مفتوح.</div>'}</div>
 ${sec('⚠ متأخرة',r.filter(i=>i.at<n))}${sec('خلال أسبوع',r.filter(i=>i.at>=n&&i.at<n+7*864e5))}${sec('بعد كده',r.filter(i=>i.at>=n+7*864e5))}
 ${r.length?'':'<div class="card meta">مفيش مواعيد جاية. اكتب في الرئيسية مثلا: قسط العربية 3000 كل شهر يوم 5</div>'}
 ${dn.length?'<h2>اتنفذت</h2>'+dn.map(remCard).join(''):''}`}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';speechSynthesis.speak(u)}catch(e){}}
function vtMsg(m,ms){const v=$('#vt');v.textContent=m;v.hidden=false;clearTimeout(vtMsg.t);if(ms)vtMsg.t=setTimeout(()=>{v.hidden=true},ms)}
function capture(v){const it=classify(v);if(it.type==='password'){sealPw(it);return 'اتسجّلت كـ باسورد (مشفّر)'}
 add(it);const m='اتسجّلت كـ '+TYPES[it.type][1]+(it.type==='money'?` (${egp(it.amount)} · ${it.cat})`:it.type==='reminder'?' موعدها '+fmt(it.at):'');toast=m;render();return m}
function micToggle(){
 if(!KEY)return;
 if(!SR)return vtMsg('المتصفح مش بيدعم التسجيل الصوتي. استخدم Edge أو Chrome.',4000);
 if(rec){rec.stop();return}
 const b=$('#fab');let fin='';rec=new SR();rec.lang='ar-EG';rec.interimResults=true;rec.continuous=false;
 rec.onstart=()=>{b.classList.add('on');vtMsg('بسمعك… اتكلم')};
 rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript+' ';fin=t.trim();vtMsg(fin)};
 rec.onerror=e=>{fin='';vtMsg(e.error==='not-allowed'||e.error==='service-not-allowed'?'اسمح للمتصفح باستخدام الميكروفون.':'مسمعتش حاجة، جرّب تاني.',3500)};
 rec.onend=()=>{rec=null;b.classList.remove('on');if(fin){const m=capture(fin);vtMsg('✔ '+m,3500);speak(m)}else if($('#vt').textContent.startsWith('بسمعك'))$('#vt').hidden=true};
 try{rec.start()}catch(e){rec=null}
}
function homeStats(){const n=Date.now(),ym=new Date().toISOString().slice(0,7),ms=S.items.filter(i=>i.type==='money'&&new Date(i.ts).toISOString().slice(0,7)===ym),T=totals(ms),up=S.items.filter(i=>i.type==='reminder'&&!i.done).sort((a,b)=>a.at-b.at),soon=up.filter(i=>i.at<n+7*864e5);

const DAYS=['الأحد|الاحد','الاثنين|الإثنين|الاتنين','الثلاثاء|التلات','الأربعاء|الاربعاء|الاربع','الخميس','الجمعة|الجمعه','السبت'];

function parseWhen(t){
  const n=new Date();let d=new Date(n),date=false,m;
  if(/بعد\s*بكر[هة]/.test(t)){d.setDate(d.getDate()+2);date=true}else if(/بعد\s*(?:اسبوع|أسبوع)/.test(t)){d.setDate(d.getDate()+7);date=true}else if(/بعد\s*شهر/.test(t)){d.setMonth(d.getMonth()+1);date=true}
  else if(m=t.match(/بعد\s*(\d+)\s*(يوم|ايام|أيام|ساع[هة]|ساعات|دقيق[هة]|دقايق|اسبوع|أسبوع|شهر)/)){
    const k=+m[1],u=m[2];date=true;
    if(/ساع/.test(u)){d.setHours(d.getHours()+k);return d}
    if(/دق/.test(u)){d.setMinutes(d.getMinutes()+k);return d}
    if(/يوم|ايام|أيام/.test(u))d.setDate(d.getDate()+k);else if(/شهر/.test(u))d.setMonth(d.getMonth()+k);else d.setDate(d.getDate()+7*k);
  }
  else if(/بكر[هة]/.test(t)){d.setDate(d.getDate()+1);date=true}
  else if(m=t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/)){d=new Date(m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):n.getFullYear(),+m[2]-1,+m[1]);date=true}
  else{for(let i=0;i<7;i++){if(new RegExp('يوم\\s*('+DAYS[i]+')').test(t)){let diff=(i-n.getDay()+7)%7||7;d.setDate(d.getDate()+diff);date=true}}}
  if(!date&&/النهارد[هة]|اليوم|الليلة|الليله/.test(t))date=true;
  let h=null,mi=0;
  if(m=t.match(/(?:الساع[هة]|ساع[هة])\s*(\d{1,2})(?::(\d{2}))?\s*(ص|م|صباح|مساء|الصبح|العصر|بالليل|الليل)?/)){
    h=+m[1];mi=+(m[2]||0);const p=m[3]||'';
    if(/م|مساء|العصر|ليل/.test(p)){if(h<12)h+=12}else if(!p&&h>=1&&h<=6)h+=12;
  }else if(m=t.match(/(\d{1,2}):(\d{2})/)){h=+m[1];mi=+m[2]}
  if(h!==null){d.setHours(h,mi,0,0);if(!date&&d<n)d.setDate(d.getDate()+1);return d}
  if(date){if(d.toDateString()===n.toDateString())d.setTime(n.getTime()+3600e3);else d.setHours(9,0,0,0);return d}
  return null;
}

const whoOf=t=>{const m=t.match(/(?:^|\s)(?:عند|من|للـ?|لـ)\s*(?:ال)?([\u0600-\u06FFA-Za-z]{2,})/);return m?m[1]:''};
function classify(raw){
  const t=norm(raw.trim()),it={id:uid(),ts:Date.now(),text:raw.trim()};
  const num=(t.match(/(\d+(?:[.,]\d+)?)/)||[])[1];
  if(/باسورد|بسورد|كلم[هة]\s*(ال)?سر|password|\bpass\b|\bpw\b/i.test(t)){
    let v=(t.split(/[:=]|\sهو\s|\sهي\s/)[1]||t.split(/\s+/).pop()).trim();
    let label=t.replace(v,'').replace(/باسورد|بسورد|كلم[هة]\s*(ال)?سر|password|pass|pw|[:=]|هو|هي/gi,'').trim()||'بدون عنوان';
    return Object.assign(it,{type:'password',label,value:v});
  }
  const past=/صرفت|دفعت|اشتريت|حاسبت|سددت|خدت بـ|قبضت|استلمت|اتحول|حولولي|مصروف|مرتب|راتب|ايراد|إيراد|دخل/.test(t);
  if(num&&past){
    const inc=/قبضت|استلمت|اتحول|حولولي|مرتب|راتب|ايراد|إيراد|دخل/.test(t);
        return Object.assign(it,{type:'money',kind:inc?'in':'out',amount:+num.replace(',','.'),cat:cat(t),who:whoOf(t.replace(num,' '))});
  }
  const when=parseWhen(t);
  const rec=/كل\s*اسبوع|كل\s*أسبوع|اسبوعي|أسبوعي/.test(t)?'week':/كل\s*شهر|شهري/.test(t)?'month':/كل\s*سن[هة]|سنوي/.test(t)?'year':'none';
  const kind=/(?:فلوس|مبلغ|سلف[هة]|دين)\s*(?:ليا|لي|لى)|(?:ليا|لي|لى)\s*(?:عند|فلوس|مبلغ)|عند\s*\S+\s*(?:فلوس|مبلغ|سلف)|هيرجع|هترجع|هيسدد|اسلفت|سلفت/.test(t)?'receivable':/(?:فلوس|مبلغ|سلف[هة]|دين)\s*عليا|عليا\s*(?:فلوس|مبلغ|سلف|دين)|لازم\s*(?:ا|أ)دفع|هسدد|استلفت|اقترضت/.test(t)?'payable':/قسط|اقساط|أقساط/.test(t)?'installment':/فاتور[هة]|ايجار|إيجار|اشتراك|رسوم|كهرب|ميه|مياه|غاز|انترنت|إنترنت/.test(t)?'bill':'normal';
  let at=when;
  if(!at&&rec==='month'&&kind!=='normal'){const m=t.match(/يوم\s*(\d{1,2})/);if(m){at=new Date();at.setDate(+m[1]);at.setHours(9,0,0,0);if(at<new Date())at.setMonth(at.getMonth()+1)}}
  if(at){const o={type:'reminder',at:at.getTime(),done:false,fired:false,pfired:false,kind,rec,lead:kind==='normal'?0:1};
    if(kind!=='normal'){const nums=[...t.matchAll(/(?<![\d\/:.,])(?:(يوم|الساع[هة]|ساع[هة]|بعد)\s*)?(\d+(?:[.,]\d+)?)(?![\d:\/])(?!\s*(?:ايام|أيام|ساع|دق|\/))/g)].filter(m=>!m[1]).map(m=>m[2]);
      o.amount=nums[0]?+nums[0].replace(',','.'):0;
      o.who=whoOf(t)}
    return Object.assign(it,o)}
  if(/https?:\/\//.test(t))return Object.assign(it,{type:'link'});
  if(/(?:\+?\d[\d\s-]{8,}\d)/.test(t))return Object.assign(it,{type:'phone'});
  return Object.assign(it,{type:'note'});
}

  else if(t.id==='radd'){const s=$('#rt').value.trim(),d=$('#rd').value;if(!s||!d)return;add({id:uid(),ts:Date.now(),type:'reminder',text:s,at:new Date(d).getTime(),done:false,fired:false,pfired:false,kind:$('#rk').value,amount:+$('#ra').value||0,who:$('#rw').value.trim(),rec:$('#rr').value,lead:+$('#rl').value});render()}
  else if(t.id==='perm'){try{Notification.requestPermission().then(render)}catch(e){}}
  else if(t.id==='csv'){const ms=S.items.filter(i=>i.type==='money');dl('expenses.csv','\ufeffالتاريخ,النوع,المبلغ,التصنيف,الجهة,ملاحظة\n'+ms.map(i=>[new Date(i.ts).toLocaleDateString('en-CA'),i.kind==='in'?'دخل':'مصروف',i.amount,i.cat,i.who,'"'+i.text.replace(/"/g,'""')+'"'].join(',')).join('\n'),'text/csv')}
  else if(t.id==='bk')dl('smart-notes-backup.json',JSON.stringify(S),'application/json');
  else if(t.id==='rs'){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=()=>f.files[0].text().then(s=>{try{const d=JSON.parse(s);if(Array.isArray(d.items)){S=d;save();render()}}catch(e){}});f.click()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='mo'&&e.target.value){month=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='cap'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('#go').click()});

setInterval(()=>{const n=Date.now();let ch=false;
  S.items.forEach(i=>{if(preCheck(i,n))ch=true;if(i.type==='reminder'&&!i.done&&!i.fired&&i.at<=n){i.fired=true;ch=true;
    try{if(Notification.permission==='granted')new Notification(remTitle(i),{body:remLine(i)})}catch(e){}
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}});
  if(ch){save();render()}},15000);
render();showLock();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
